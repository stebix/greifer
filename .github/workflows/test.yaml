name: Test

on:
  push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest --tb=short --cov=greifer --cov-report=term-missing --cov-report=json

      - name: Extract coverage and compute badge color
        run: |
          COVERAGE=$(python3 -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          # Map coverage to a shields.io named color
          if [ "$COVERAGE" -ge 90 ]; then COLOR=brightgreen
          elif [ "$COVERAGE" -ge 75 ]; then COLOR=green
          elif [ "$COVERAGE" -ge 60 ]; then COLOR=yellowgreen
          elif [ "$COVERAGE" -ge 40 ]; then COLOR=yellow
          elif [ "$COVERAGE" -ge 20 ]; then COLOR=orange
          else COLOR=red; fi
          echo "COLOR=$COLOR" >> "$GITHUB_ENV"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/trunk'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: greifer-coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          color: ${{ env.COLOR }}
